# General
theme = "fleet_transparent"

# Editor
[editor]
cursorline = true
true-color = true
color-modes = true
line-number = "relative"
breadcrumb = { enable = true, path = "file", max-depth = 4 }
bufferline = { render-mode = "multiple", separator = "|" }
gutters = ["line-numbers", "diff", "diagnostics", "spacer"]

search = { smart-case = true }
soft-wrap = { enable = true }
file-picker = { hidden = false }
auto-reload = { focus-gained = true }

end-of-line-diagnostics = "hint"
inline-blame = { show = "cursor-line", auto-fetch = false }
inline-diagnostics = { cursor-line = "hint" }
completion-highlight = { highlight-type = "theme-colors" }

[editor.lsp]
display-messages = true
display-inlay-hints = true
signature-help-position = "below"
color-swatches-string = "■"

[editor.persistence]
old-files = true
commands = true
search = true
clipboard = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
separator = "|"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
left = [
  "mode",
  "spacer",
  "spacer",
  "version-control",
  "spacer",
  "diagnostics",
  "separator",
  "file-name",
  "file-modification-indicator",
]
right = [
  "spinner",
  "register",
  "spacer",
  "separator",
  "position",
  "position-percentage",
  "file-type",
]
